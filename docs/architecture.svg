<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order placement flow</title>
  <desc id="desc">Architecture diagram showing the ShopLedger browser UI, Express server, route modules, library modules, configuration, JSON data store, order placement flow, and invoice renderer.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#526579"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172b3a;font-size:14px}
      .title{font-size:24px;font-weight:700}.subtitle{font-size:14px;fill:#516678}
      .head{font-size:16px;font-weight:700}.small{font-size:12px}.bold{font-weight:700}
      .panel{fill:#f5f8fb;stroke:#9aabba;stroke-width:1.5}.node{fill:#fff;stroke:#526579;stroke-width:1.5}
      .ticket{fill:#fce7cf;stroke:#bd641c;stroke-width:2}.flow{fill:none;stroke:#526579;stroke-width:2;marker-end:url(#arrow)}
      .flowdash{fill:none;stroke:#526579;stroke-width:1.6;stroke-dasharray:6 5;marker-end:url(#arrow)}
      .num{fill:#173e5b}.numtxt{fill:#fff;font-weight:700;font-size:14px}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#ffffff"/>
  <text x="28" y="38" class="title">ShopLedger | application architecture</text>
  <text x="28" y="62" class="subtitle">Order placement flow (numbered) and the files that handle it</text>

  <!-- Numbered order flow -->
  <rect x="24" y="82" width="1152" height="164" rx="12" class="panel"/>
  <text x="42" y="108" class="head">Place an order</text>
  <g>
    <rect x="42" y="126" width="132" height="84" rx="8" class="node"/><circle cx="56" cy="140" r="12" class="num"/><text x="52" y="145" class="numtxt">1</text>
    <text x="72" y="151" class="bold">Browser UI</text><text x="54" y="174">public/js/app.js</text><text x="54" y="194" class="small">POST cart + customer</text>
    <path d="M174 168 H196" class="flow"/>
    <rect x="202" y="126" width="140" height="84" rx="8" class="node"/><circle cx="216" cy="140" r="12" class="num"/><text x="212" y="145" class="numtxt">2</text>
    <text x="232" y="151" class="bold">Express entry</text><text x="214" y="174">server.js</text><text x="214" y="194" class="small">mounts /api router</text>
    <path d="M342 168 H364" class="flow"/>
    <rect x="370" y="126" width="150" height="84" rx="8" class="node"/><circle cx="384" cy="140" r="12" class="num"/><text x="380" y="145" class="numtxt">3</text>
    <text x="400" y="151" class="bold">Validate &amp; resolve</text><text x="382" y="174">routes/orders.js</text><text x="382" y="194" class="small">find products, check stock</text>
    <path d="M520 168 H542" class="flow"/>
    <rect x="548" y="126" width="176" height="84" rx="8" class="node"/><circle cx="562" cy="140" r="12" class="num"/><text x="558" y="145" class="numtxt">4</text>
    <text x="578" y="151" class="bold">Compute totals</text><text x="560" y="174">pricing + coupons + tax</text><text x="560" y="194" class="small">lib/pricing.js, coupons.js, tax.js</text>
    <path d="M724 168 H746" class="flow"/>
    <rect x="752" y="126" width="166" height="84" rx="8" class="node"/><circle cx="766" cy="140" r="12" class="num"/><text x="762" y="145" class="numtxt">5</text>
    <text x="782" y="151" class="bold">Update Khata</text><text x="764" y="174">lib/ledger.js</text><text x="764" y="194" class="small">only for khata payment</text>
    <path d="M918 168 H940" class="flow"/>
    <rect x="946" y="126" width="204" height="84" rx="8" class="node"/><circle cx="960" cy="140" r="12" class="num"/><text x="956" y="145" class="numtxt">6</text>
    <text x="976" y="151" class="bold">Reserve, record, save</text><text x="958" y="174">inventory + orders + store</text><text x="958" y="194" class="small">data/db.json; return order (7)</text>
  </g>

  <!-- Architecture map -->
  <rect x="24" y="266" width="202" height="292" rx="12" class="panel"/>
  <text x="42" y="293" class="head">Browser</text>
  <rect x="42" y="309" width="166" height="66" rx="8" class="node"/>
  <text x="56" y="334" class="bold">public/</text><text x="56" y="355">index.html · css/ · js/</text>
  <text x="42" y="403" class="small">POS catalog and cart</text><text x="42" y="423" class="small">Calls /api endpoints</text>
  <path d="M226 416 H262" class="flow"/>

  <rect x="264" y="266" width="182" height="292" rx="12" class="panel"/>
  <text x="282" y="293" class="head">Express app</text>
  <rect x="282" y="309" width="146" height="66" rx="8" class="node"/>
  <text x="296" y="336" class="bold">server.js</text><text x="296" y="357">middleware + mounts</text>
  <rect x="282" y="400" width="146" height="92" rx="8" class="node"/>
  <text x="296" y="426" class="bold">GET invoice</text><text x="296" y="448">orders.get()</text><text x="296" y="470">invoice.render()</text>
  <path d="M446 345 H470" class="flow"/>

  <rect x="472" y="266" width="184" height="292" rx="12" class="panel"/>
  <text x="490" y="293" class="head">routes/</text>
  <rect x="490" y="309" width="148" height="44" rx="7" class="node"/><text x="502" y="336">products.js</text>
  <rect x="490" y="363" width="148" height="44" rx="7" class="node"/><text x="502" y="390" class="bold">orders.js</text>
  <rect x="490" y="417" width="148" height="44" rx="7" class="node"/><text x="502" y="444">customers.js</text>
  <rect x="490" y="471" width="148" height="44" rx="7" class="node"/><text x="502" y="498">reports.js</text>
  <path d="M656 385 H680" class="flow"/>

  <rect x="682" y="266" width="308" height="476" rx="12" class="panel"/>
  <text x="700" y="293" class="head">lib/</text>
  <rect x="700" y="309" width="126" height="46" rx="7" class="ticket"/><text x="711" y="337" class="bold">invoice.js</text>
  <rect x="838" y="309" width="134" height="46" rx="7" class="node"/><text x="850" y="337">pricing.js</text>
  <rect x="700" y="365" width="126" height="46" rx="7" class="node"/><text x="711" y="393">coupons.js</text>
  <rect x="838" y="365" width="134" height="46" rx="7" class="node"/><text x="850" y="393">tax.js</text>
  <rect x="700" y="421" width="126" height="46" rx="7" class="node"/><text x="711" y="449">inventory.js</text>
  <rect x="838" y="421" width="134" height="46" rx="7" class="node"/><text x="850" y="449">ledger.js</text>
  <rect x="700" y="477" width="126" height="46" rx="7" class="node"/><text x="711" y="505">orders.js</text>
  <rect x="838" y="477" width="134" height="46" rx="7" class="node"/><text x="850" y="505">reports.js</text>
  <rect x="700" y="533" width="126" height="46" rx="7" class="node"/><text x="711" y="561">dates.js</text>
  <rect x="838" y="533" width="134" height="46" rx="7" class="node"/><text x="850" y="561">store.js</text>
  <path d="M826 332 H838" class="flowdash"/>

  <rect x="1010" y="266" width="166" height="142" rx="12" class="panel"/>
  <text x="1028" y="293" class="head">Settings</text>
  <rect x="1028" y="309" width="130" height="66" rx="8" class="node"/>
  <text x="1042" y="337" class="bold">config.js</text><text x="1042" y="357">GST, coupons, shop</text>
  <path d="M990 380 H1006" class="flowdash"/>

  <rect x="1010" y="428" width="166" height="142" rx="12" class="panel"/>
  <text x="1028" y="455" class="head">Persistent data</text>
  <rect x="1028" y="471" width="130" height="66" rx="8" class="node"/>
  <text x="1042" y="499" class="bold">data/db.json</text><text x="1042" y="519">orders, stock, ledger</text>
  <path d="M990 555 H1006" class="flow"/>

  <path d="M446 448 C560 448 570 332 696 332" class="flow"/>
  <path d="M990 605 H1004" class="flow"/>

  <!-- Legend and invoice relation -->
  <rect x="24" y="590" width="632" height="152" rx="12" class="panel"/>
  <text x="42" y="618" class="head">Legend &amp; related paths</text>
  <rect x="42" y="636" width="24" height="18" rx="3" class="ticket"/><text x="76" y="651">Ticket focus: lib/invoice.js</text>
  <path d="M42 681 H82" class="flow"/><text x="94" y="686">Request / data flow</text>
  <path d="M274 681 H314" class="flowdash"/><text x="326" y="686">Module dependency / configuration</text>
  <text x="42" y="719" class="small">Invoice renderer reads saved order via server.js; reports.js also calls computeInvoiceFigures().</text>
  <text x="700" y="700" class="small">lib/tax.js is shown because pricing.js uses it for checkout GST.</text>
  <text x="700" y="722" class="small">invoice.js itself does not import tax.js.</text>
  <text x="28" y="780" class="small" fill="#516678">ShopLedger code map · file names verified from repository listing and source references</text>
</svg>
